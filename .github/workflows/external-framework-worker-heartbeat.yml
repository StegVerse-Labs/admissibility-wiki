name: External framework worker heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'docs/external-frameworks/worker-task-registry.json'
      - 'scripts/check_external_framework_worker_heartbeat.py'
      - '.github/workflows/external-framework-worker-heartbeat.yml'

permissions:
  contents: read

concurrency:
  group: external-framework-worker-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate active worker registry and emit heartbeat receipt
        run: python scripts/check_external_framework_worker_heartbeat.py
      - name: Upload worker heartbeat receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-framework-worker-heartbeat
          path: reports/external-frameworks/worker-heartbeat.json
          if-no-files-found: error
          retention-days: 30
