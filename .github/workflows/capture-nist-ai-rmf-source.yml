name: Capture NIST AI RMF source receipt

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/capture_nist_ai_rmf_source_receipt.py'
      - '.github/workflows/capture-nist-ai-rmf-source.yml'
      - 'docs/external-frameworks/nist-ai-rmf.md'
      - 'docs/external-frameworks/nist-ai-rmf.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and hash official NIST AI RMF 1.0 PDF
        run: python scripts/capture_nist_ai_rmf_source_receipt.py
      - name: Upload hash-only source receipt
        uses: actions/upload-artifact@v4
        with:
          name: nist-ai-rmf-1.0-source-receipt
          path: reports/external-frameworks/nist-ai-rmf/nist-ai-rmf-1.0-source-receipt.json
          if-no-files-found: error
          retention-days: 30
