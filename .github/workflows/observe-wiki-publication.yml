name: Observe wiki publication

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: admissibility-wiki-publication-observer
  cancel-in-progress: true

jobs:
  observe-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect canonical workflow and public route
        id: observe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = new Date('2026-08-02T09:04:54Z');
            const workflow_id = 'validate-chain-continuation.yml';
            const issue_number = 56;
            const route = 'https://stegverse-labs.github.io/admissibility-wiki/external-frameworks/mindforge';
            const requiredMarkers = [
              'Reviewed for architectural boundary semantics',
              'Attribution-Confirmation Participation Loop'
            ];

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch: 'main',
              per_page: 25
            });

            const candidates = runsResponse.data.workflow_runs
              .filter(run => new Date(run.run_started_at || run.created_at) >= cutoff)
              .sort((a, b) => new Date(b.run_started_at || b.created_at) - new Date(a.run_started_at || a.created_at));

            const run = candidates[0] || null;
            let jobs = [];
            let artifacts = [];
            if (run) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              jobs = jobsResponse.data.jobs.map(job => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                html_url: job.html_url
              }));
              const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              artifacts = artifactsResponse.data.artifacts.map(artifact => ({
                id: artifact.id,
                name: artifact.name,
                expired: artifact.expired,
                size_in_bytes: artifact.size_in_bytes
              }));
            }

            let routeStatus = null;
            let routeText = '';
            let routeError = null;
            try {
              const response = await fetch(`${route}?observer=${Date.now()}`, {
                redirect: 'follow',
                headers: { 'cache-control': 'no-cache' }
              });
              routeStatus = response.status;
              routeText = await response.text();
            } catch (error) {
              routeError = String(error);
            }

            const markerResults = Object.fromEntries(
              requiredMarkers.map(marker => [marker, routeText.includes(marker)])
            );
            const jobByName = Object.fromEntries(jobs.map(job => [job.name, job]));
            const requiredJobs = ['build-pages', 'deploy-pages', 'verify-public-pages'];
            const requiredJobResults = Object.fromEntries(
              requiredJobs.map(name => [name, jobByName[name]?.conclusion || 'MISSING'])
            );

            const complete = Boolean(
              run &&
              requiredJobs.every(name => requiredJobResults[name] === 'success') &&
              routeStatus === 200 &&
              requiredMarkers.every(marker => markerResults[marker])
            );

            const receipt = {
              schema: 'stegverse.wiki-publication-observation.v1',
              observed_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              canonical_workflow: workflow_id,
              cutoff,
              state: complete ? 'COMPLETE' : 'BLOCKED',
              issue_number,
              run: run ? {
                id: run.id,
                run_number: run.run_number,
                attempt: run.run_attempt,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_sha: run.head_sha,
                created_at: run.created_at,
                run_started_at: run.run_started_at,
                updated_at: run.updated_at,
                html_url: run.html_url
              } : null,
              jobs,
              required_job_results: requiredJobResults,
              artifacts,
              public_route: {
                url: route,
                status: routeStatus,
                error: routeError,
                markers: markerResults
              },
              release_condition_satisfied: complete,
              next_action: complete
                ? 'Update both mirror handoffs with this run-bound evidence, release WIKI-PUB-VALIDATION-2026-08-02, and unblock MF-NOTICE-001.'
                : 'Wait for or repair the canonical workflow until build-pages, deploy-pages, verify-public-pages, and both rendered markers succeed.'
            };

            fs.mkdirSync('reports/wiki-publication-observer', { recursive: true });
            fs.writeFileSync(
              'reports/wiki-publication-observer/receipt.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );

            core.setOutput('complete', complete ? 'true' : 'false');
            core.setOutput('run_id', run ? String(run.id) : '');
            core.setOutput('summary', JSON.stringify(receipt));

      - name: Upload publication observation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-publication-observation
          path: reports/wiki-publication-observer/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Comment verified evidence on canonical issue
        if: steps.observe.outputs.complete == 'true'
        uses: actions/github-script@v7
        env:
          OBSERVATION: ${{ steps.observe.outputs.summary }}
        with:
          script: |
            const receipt = JSON.parse(process.env.OBSERVATION);
            const body = [
              '## Automated publication observation: COMPLETE',
              '',
              `Observed at: \`${receipt.observed_at}\``,
              `Canonical run: ${receipt.run.html_url}`,
              `Head SHA: \`${receipt.run.head_sha}\``,
              '',
              'Required jobs:',
              ...Object.entries(receipt.required_job_results).map(([name, result]) => `- \`${name}\`: \`${result}\``),
              '',
              'Rendered markers:',
              ...Object.entries(receipt.public_route.markers).map(([marker, present]) => `- \`${marker}\`: \`${present}\``),
              '',
              'The workflow artifact `wiki-publication-observation` contains the complete machine-readable receipt.',
              '',
              'Repository handoffs still must be updated with these run-bound identifiers before this issue is closed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 56,
              body
            });

      - name: Enforce observation state
        if: always()
        run: test "${{ steps.observe.outputs.complete }}" = "true"
